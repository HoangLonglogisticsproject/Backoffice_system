# SonarCloud automatic-analysis configuration for this repository.
#
# AI is an independent bounded application and intentionally does not import
# Backend runtime internals (ADR-0007, docs/architecture/adr-0007-ai-platform-
# boundary.md). CPD exclusions are limited to infrastructure implementations
# duplicated to preserve this boundary: the migration runner, the pool adapter,
# the keyset cursor, the env schema, the health probe and the integration-test
# harness. Each copy is pinned by its own tests on its own side.
#
# Nothing under AI/src/core (the Alert domain, application, persistence, API)
# is excluded, and no rule is disabled. Scope, sources and tests stay at the
# automatic-analysis defaults.
sonar.cpd.exclusions=\
  AI/src/infrastructure/database/migration-runner.ts,\
  AI/src/infrastructure/database/database.service.ts,\
  AI/src/common/pagination/cursor.ts,\
  AI/src/config/env.schema.ts,\
  AI/src/infrastructure/health/health.controller.ts,\
  AI/tests/helpers/require-database.ts,\
  AI/tests/helpers/integration-database.ts
