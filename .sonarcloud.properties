# SonarCloud — Automatic Analysis configuration.
#
# ★ WHY THIS FILE EXISTS, AND WHY IT IS THIS SMALL.
#
# The repository is analysed by SonarCloud's AUTOMATIC ANALYSIS through the
# GitHub App — there is no scanner, no CI job and no `sonar-project.properties`
# (see the SonarCloud note at the end of `.github/workflows/ci.yml`). This file
# is the only supported way to configure that analysis, and it is used for
# exactly one thing: to stop an Oracle PL/SQL rule being applied to PostgreSQL
# DDL that cannot obey it.
#
# Nothing here excludes a source file, a test, or a rule from the application
# code. `sonar.sources` is deliberately NOT set, so discovery stays as
# SonarCloud chooses it.
#
# ---------------------------------------------------------------------------
# The one exclusion: plsql:S1192 inside `backend/migrations/`
# ---------------------------------------------------------------------------
#
# S1192 is "Define a constant instead of duplicating this literal". It is a
# sound rule for procedural code. It is not applicable here, for two
# independent reasons:
#
# 1. ★ THE RULE ASKS FOR SOMETHING THE LANGUAGE CANNOT EXPRESS. The flagged
#    literals are values like `'active'`, `'pending'` and `'immutable'` that
#    appear in a column DEFAULT and again in the CHECK constraint listing the
#    values that column may hold. Repeating them is not duplication to be
#    factored out — it is how a PostgreSQL DDL script states a default and its
#    domain. Plain DDL has no constants. The only ways to avoid the repetition
#    are `DO $$ … EXECUTE format(…) $$` dynamic SQL, which turns a readable
#    migration into a string-building exercise, or psql `\set` variables, which
#    are a psql client feature and are NOT understood by the `pg` driver the
#    migration runner uses — using them would BREAK every migration.
#
# 2. ★ THE ANALYSER IS THE WRONG ONE FOR THESE FILES. The rule key is `plsql:`,
#    SonarSource's ORACLE PL/SQL analyser. These files are PostgreSQL DDL. The
#    findings are an artefact of dialect detection on a `.sql` extension rather
#    than a judgement about this code.
#
# ★ AND THESE FILES ARE IMMUTABLE ANYWAY. The migration runner stores a
# checksum per file and refuses to start if one that has already run is
# changed — see README §7, "Sửa sai bằng một file mới, không sửa file đã chạy".
# A finding whose only remedy is editing applied migration history is a finding
# that must not be acted on. Suppressing the report is the honest outcome;
# leaving it open would train the next reader to ignore Sonar.
#
# ⚠ THIS IS NOT "MIGRATIONS ARE UNCHECKED". They carry more verification than
# any other part of the repository: `backend/tests/migrations/` holds schema
# specs and an integration spec, and the 500+ integration tests apply all 17
# migrations to a real PostgreSQL 17 cluster on every CI run, asserting the
# constraints, triggers, partial uniques and composite foreign keys those
# literals define. What is switched off here is one lexical rule from the wrong
# dialect — nothing else.
#
# ⚠ SCOPE. This suppresses ONE rule in ONE directory. It is not a project-wide
# ignore, and it must not become one. Any other Sonar finding — including a
# future PL/SQL finding outside `backend/migrations/` — is still reported.

sonar.issue.ignore.multicriteria=migrationLiterals

sonar.issue.ignore.multicriteria.migrationLiterals.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.migrationLiterals.resourceKey=backend/migrations/**/*.sql
