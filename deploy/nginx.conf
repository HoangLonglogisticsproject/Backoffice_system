# /etc/nginx/sites-available/opsystem — the only thing on this host listening
# publicly. Frontend is static files; everything under /api is the NestJS app.

upstream backoffice_api {
    # The published port from docker-compose, bound to loopback.
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name opsystem.hoanglonglti.com;

    # Cloudflare terminates TLS at the edge and talks to this origin over HTTPS
    # under Full (strict). Port 80 exists only to redirect: the certificate is a
    # Cloudflare Origin CA one, issued in the dashboard and valid for years, so
    # there is no ACME challenge to answer here.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ponytail: no HTTP/2 on the origin. `http2 on;` needs nginx >= 1.25.1 and
    # Ubuntu 22.04 ships 1.18, where it fails `nginx -t` outright. Cloudflare
    # already speaks HTTP/2 and HTTP/3 to the browser, so the origin hop gains
    # nothing. Add `listen 443 ssl http2;` if this ever stops sitting behind a
    # CDN.
    server_name opsystem.hoanglonglti.com;

    ssl_certificate     /etc/ssl/cloudflare/opsystem.pem;
    ssl_certificate_key /etc/ssl/cloudflare/opsystem.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/opsystem;
    index index.html;

    # ★ THE TRAILING SLASH ON proxy_pass IS THE WHOLE ROUTING RULE.
    # The API has no global prefix — its routes are /auth/login, /departments,
    # /health. `proxy_pass http://upstream/` strips the /api/ this location
    # matched, so /api/auth/login reaches the app as /auth/login. Remove that
    # slash and every request 404s.
    location /api/ {
        proxy_pass http://backoffice_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        '';
        proxy_read_timeout 60s;
    }

    # The SPA owns its own routing: anything that is not a real file is
    # index.html, or a refresh on /approvals returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so they can be cached hard. index.html must not be, or a
    # deploy is invisible until the browser decides otherwise.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html { add_header Cache-Control "no-store"; }

    client_max_body_size 2m;
    access_log /var/log/nginx/opsystem.access.log;
    error_log  /var/log/nginx/opsystem.error.log;
}
