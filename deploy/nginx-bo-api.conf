# /etc/nginx/sites-available/bo-api — the API's OWN public hostname.
#
# ★ THIS IS A SECOND DOOR TO THE SAME ROOM, NOT A REPLACEMENT. `nginx.conf`
# (opsystem.hoanglonglti.com, Cloudflare origin certificate) stays exactly as it
# is, and so does the Cloudflare Tunnel. What this adds is a path to the backend
# that depends on nothing but DNS and this box:
#
#     Vercel edge function  ──HTTPS──>  bo-api.hoanglonglti.com  ──>  nginx  ──>  127.0.0.1:3000
#                                       (Matbao A record, straight at the VPS)
#
# The tunnel was the only route before, which made a `cloudflared` restart a
# total frontend outage. Failing over is now one environment variable on the
# Vercel project (BACKEND_ORIGIN) and a redeploy — see deploy/README.md.
#
# ★ THE BROWSER NEVER CALLS THIS HOST, and that is deliberate. `bo_session` is
# SameSite=Strict, so a request from the Vercel origin to this one would be
# cross-site and arrive anonymous. The only client here is the Vercel edge
# function, server-side, where SameSite does not apply. Which is also why CORS
# stays off and why this block deliberately serves NO static files: there is no
# frontend on this hostname to serve.

upstream backoffice_api_direct {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ★ ONE ZONE PER FILE. `limit_conn_zone` is global and a duplicate name is a
# hard `nginx -t` failure, so this cannot be called `sse_streams` — nginx.conf
# already owns that name. The two hostnames therefore have SEPARATE stream
# budgets, which is correct: they are separate ingress paths.
#
# Sized much smaller than the tunnelled one on purpose. Requests arriving here
# come from Vercel's edge, not from a browser, so $binary_remote_addr is a
# Vercel POP rather than a driver's phone — still shared, but by far fewer
# clients than a Cloudflare edge fronting the whole site.
limit_conn_zone $binary_remote_addr zone=sse_direct:10m;

server {
    listen 80;
    listen [::]:80;
    server_name bo-api.hoanglonglti.com;

    # ★ ACME LIVES ABOVE THE REDIRECT. certbot's webroot challenge is a plain
    # HTTP GET, by definition — Let's Encrypt does not follow a redirect to a
    # certificate it has not issued yet, which is the chicken-and-egg every
    # first issuance runs into. This one location is served; everything else on
    # :80 is told to come back over TLS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # ponytail: no `http2 on;` — Ubuntu 22.04 ships nginx 1.18 and the directive
    # fails `nginx -t` outright there. Same reason as nginx.conf. The only
    # client is a serverless fetch making one request at a time, so there is no
    # multiplexing to win.
    server_name bo-api.hoanglonglti.com;

    # ★ A REAL LET'S ENCRYPT CERTIFICATE, NOT THE CLOUDFLARE ORIGIN ONE.
    # /etc/ssl/cloudflare/opsystem.pem is signed by Cloudflare's private origin
    # CA, which no public trust store carries: Vercel's fetch would reject it.
    # These paths are certbot's, and the renewal timer rewrites them in place.
    ssl_certificate     /etc/letsencrypt/live/bo-api.hoanglonglti.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bo-api.hoanglonglti.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # This hostname is reached directly, so HSTS is ours to set and is actually
    # meaningful here — there is no CDN in front adding it.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ★ THE TRAILING SLASH ON proxy_pass IS THE WHOLE ROUTING RULE, and it is
    # the same rule as nginx.conf for a reason: the Vercel function FORWARDS the
    # /api prefix rather than stripping it (see frontend/api/[...path].ts), so
    # both ingress paths must strip it here or every request arrives as //health.
    # Change one and you have two hostnames that disagree about their own API.
    location = /api/notifications/stream {
        limit_conn sse_direct 200;
        limit_conn_status 429;
        proxy_pass http://backoffice_api_direct/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }

    location /api/ {
        proxy_pass http://backoffice_api_direct/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        '';
        proxy_read_timeout 60s;
    }

    # ★ NOTHING ELSE EXISTS ON THIS HOSTNAME. No `root`, no `try_files`, no
    # index.html — an API host that answers / with a login page is an invitation
    # to bookmark the wrong origin and then wonder why the session does not
    # stick. 404, and the answer says nothing about what is behind it.
    location / { return 404; }

    client_max_body_size 2m;
    access_log /var/log/nginx/bo-api.access.log;
    error_log  /var/log/nginx/bo-api.error.log;
}
